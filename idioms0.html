const $=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='english-idioms-in-use-quiz-progress-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){saved={}}
let current=null,screen='dashboard';
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
const percent=(a,b)=>Math.round(a/Math.max(1,b)*100);
const testkey=(u,i)=>`${u}:${i}`;
const byid=new Map(D.entries.map(e=>[e.id,e]));
function dashboard(){screen='dashboard';current=null;
 let n=0,covered=new Set();for(const s of Object.values(saved)){if(s?.completed){n++;for(const id of s.ids||[])covered.add(id)}}
 let total=D.units.reduce((a,u)=>a+u.tests.length,0);
 $('root').innerHTML=`<section class="hero"><h1>Idioms in context.<br>Meaning in English.</h1><p>Тематические карточки по <em>English Idioms in Use — Intermediate</em>: выбери значение устойчивого выражения среди четырёх английских вариантов. После неправильного ответа увидишь верное значение, а в конце пройдёшь повторение всех ошибок.</p></section><div class="panel stats"><div><div class="small">Завершено тестов</div><div class="stat">${n} / ${total}</div></div><div><div class="small">Изучено карточек</div><div class="stat">${covered.size} / ${D.entries.length}</div></div><div style="width:270px;max-width:100%"><div class="small">Общий прогресс · ${percent(n,total)}%</div><div class="meter"><div style="width:${percent(n,total)}%"></div></div></div></div><div class="topics">${D.units.map(u=>`<article class="panel topic"><div class="topic-head"><div><div class="topic-num">UNIT ${String(u.id).padStart(2,'0')}</div><h2>${esc(u.title)}</h2><p>${u.count} выражений · ${u.tests.length} ${u.tests.length===1?'тест':'теста'}</p></div><span class="chip">${u.count}</span></div><div class="test-list">${u.tests.map((t,i)=>{let s=saved[testkey(u.id,i)];return `<button class="testbtn ${s?.completed?'done':''}" data-unit="${u.id}" data-test="${i}"><strong>Тест ${i+1} ${s?.completed?'✓':''}</strong><span>${t.length} карточек · ${s?.completed?`${s.score}/${t.length} с первого раза`:'Начать →'}</span></button>`}).join('')}</div></article>`).join('')}</div>`;
 document.querySelectorAll('[data-unit]').forEach(btn=>btn.addEventListener('click',()=>start(Number(btn.dataset.unit),Number(btn.dataset.test))));window.scrollTo(0,0);
}
function start(unit,n){let u=D.units.find(x=>x.id===unit),ids=u?.tests[n];if(!ids?.length)return;
 current={unit,n,items:[...ids],mode:'main',sequence:[...ids],pos:0,selected:null,missed:[],retryMissed:[],round:0,correct:0};question();window.scrollTo(0,0)}
function item(){return byid.get(current.sequence[current.pos])}
function question(){screen='quiz';let s=current,e=item(),rev=s.mode==='review';
 $('root').innerHTML=`<div class="quiz"><div class="quiznav"><button class="back" id="return">← Все темы</button><span class="chip">UNIT ${s.unit} · TEST ${s.n+1}</span></div>${rev?`<div class="review"><strong>Работа над ошибками · Раунд ${s.round}</strong><br>Неправильные ответы ещё раз встретятся в следующем раунде.</div>`:''}<div class="panel top"><div class="toprow"><span class="small">${rev?'ПОВТОРЕНИЕ':'ОСНОВНОЙ ТЕСТ'}</span><span class="muted">${s.pos+1} / ${s.sequence.length}</span></div><div class="meter"><div style="width:${percent(s.pos+(s.selected!==null?1:0),s.sequence.length)}%"></div></div></div><article class="panel q"><div class="word-label">Choose the correct meaning</div><div class="idiom">${esc(e.word)}</div><p class="prompt">Select one English definition.</p><div class="opts">${e.options.map((o,i)=>`<button class="opt" data-opt="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions" id="actions"></div></article></div>`;
 $('return').addEventListener('click',dashboard);document.querySelectorAll('[data-opt]').forEach(btn=>btn.addEventListener('click',()=>answer(Number(btn.dataset.opt))));
}
function answer(i){let s=current;if(!s||s.selected!==null)return;let e=item();s.selected=i;let ok=i===e.correct;
 if(s.mode==='main'){if(ok)s.correct++;else s.missed.push(e.id)}else if(!ok)s.retryMissed.push(e.id);
 document.querySelectorAll('[data-opt]').forEach(btn=>{let j=Number(btn.dataset.opt);btn.disabled=true;btn.classList.add(j===e.correct?'good':j===i?'bad':'dim')});
 $('feedback').innerHTML=`<div class="notice ${ok?'good':'bad'}"><strong>${ok?'✓ Верно!':'✕ Неверно'}</strong><div style="margin-top:7px">${ok?'Отлично — значение определено правильно.':`Правильный ответ: <strong>${'ABCD'[e.correct]}</strong>. `}${esc(e.options[e.correct])}</div></div>`;
 $('actions').innerHTML='<button class="btn" id="next">Продолжить →</button>';
 $('next').addEventListener('click',next);
}
function next(){let s=current;if(!s||s.selected===null)return;
 if(s.pos<s.sequence.length-1){s.pos++;s.selected=null;question();window.scrollTo({top:0,behavior:'smooth'});return}
 if(s.mode==='main'){if(!s.missed.length){finish();return} s.mode='review';s.round=1;s.sequence=[...s.missed];s.retryMissed=[];s.pos=0;s.selected=null;question();window.scrollTo(0,0);return}
 if(s.retryMissed.length){s.round++;s.sequence=[...s.retryMissed];s.retryMissed=[];s.pos=0;s.selected=null;question();window.scrollTo(0,0);return}
 finish();
}
function finish(){let s=current,k=testkey(s.unit,s.n),old=saved[k];let res={completed:true,score:s.correct,ids:s.items,mistakes:s.missed.length,rounds:s.round};
 if(!old?.completed||res.score>=old.score)saved[k]=res;persist();screen='summary';
 $('root').innerHTML=`<section class="panel summary"><div class="small">UNIT ${s.unit} · TEST ${s.n+1} · ГОТОВО</div><h1>Тест завершён!</h1><div class="result">${s.correct} / ${s.items.length}</div><p class="muted">Правильных ответов с первой попытки: ${percent(s.correct,s.items.length)}%. ${s.missed.length?`Повторено ${s.missed.length} ошибок за ${s.round} раунд(а).`:'Повторение не потребовалось.'}</p>${s.missed.length?`<h2>Слова для закрепления</h2><ul class="missed">${s.missed.map(id=>{let e=byid.get(id);return `<li><strong>${esc(e.word)}</strong><span>${esc(e.meaning)}</span></li>`}).join('')}</ul>`:''}<div class="actions"><button class="btn alt" id="again">Пройти ещё раз</button><button class="btn" id="back">К темам →</button></div><p class="muted" style="font-size:12px;line-height:1.65">Баллы учитывают только первые ответы. Повторение помогает закрепить ошибки, но не меняет исходную оценку.</p></section>`;
 $('again').addEventListener('click',()=>start(s.unit,s.n));$('back').addEventListener('click',dashboard);window.scrollTo(0,0);
}
document.addEventListener('keydown',ev=>{if(screen!=='quiz'||!current||ev.ctrlKey||ev.altKey||ev.metaKey)return;if(['1','2','3','4'].includes(ev.key)&&current.selected===null){ev.preventDefault();answer(Number(ev.key)-1)}else if(ev.key==='Enter'&&current.selected!==null){ev.preventDefault();next()}});
dashboard();
</script></body></html>
