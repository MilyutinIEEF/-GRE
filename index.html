:800,"word":"virtuoso","definition":"someone with masterly skills; expert musician","block":17,"half":2,"clue":"someone with masterly skills; expert musician","options":["a beginner attempting a demanding craft","an ordinary performer with little specialization","someone with masterly skills; expert musician","a knowledgeable critic who never performs"],"correct":2},{"id":801,"word":"visage","definition":"countenance; appearance; aspect","block":17,"half":2,"clue":"a person's face or visible facial appearance","options":["the expression in a person's voice","a person's customary posture","a distinctive pattern of handwriting","a person's face or visible facial appearance"],"correct":3},{"id":802,"word":"viscous","definition":"thick, syrupy, and sticky","block":17,"half":2,"clue":"thick, syrupy, and sticky","options":["thin and flowing freely","cruel or aggressive in manner and conduct","thick, syrupy, and sticky","dry and granular rather than fluid"],"correct":2},{"id":803,"word":"vitiate","definition":"to impair the quality of; corrupt morally; make inoperative","block":17,"half":2,"clue":"to impair the quality of; corrupt morally; make inoperative","options":["to restore an object's original purity","to impair the quality of; corrupt morally; make inoperative","to strengthen a weakened conclusion","to improve a process without changing its quality"],"correct":1},{"id":804,"word":"vituperative","definition":"using or containing harsh, abusive censure","block":17,"half":2,"clue":"using or containing harsh, abusive censure","options":["conciliatory in response to criticism","restrained and factual in disagreement","using or containing harsh, abusive censure","gentle despite profound disapproval"],"correct":2},{"id":805,"word":"vivisection","definition":"dissection, surgery, or painful experiments performed on a living animal for the purpose of scientific research","block":17,"half":2,"clue":"scientific dissection or experimentation on a living animal","options":["the const KEY='gre-barrons-816-progress-v2';
const QSIZE=24;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){saved={}};
let current=null;let view='dashboard';
function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function key(b,h){return `${b}-${h}`}
function words(b,h){return DATA.words.filter(x=>x.block===b && x.half===h)}
function finishedCount(){return Object.keys(saved).filter(k=>saved[k]&&saved[k].completed).length}
function pct(a,b){return Math.round(100*a/Math.max(1,b))}
function dashboard(){
 view='dashboard';current=null;
 const completed=finishedCount();let seen=new Set();for(const v of Object.values(saved))if(v?.completed)for(const i of v.ids||[])seen.add(i);
 $('root').innerHTML=`<section><h1>Запоминай слова.<br>Проверяй себя.</h1><p class="intro">34 интерактивных теста по 24 слова: каждый термин встречается ровно в одном основном тесте. Все четыре определения — на английском. Варианты подобраны по части речи и смыслу; похожие слова специально перепутаны в ловушках. После ответа сразу видно результат, а в конце теста повторяются все ошибки.</p><div class="panel dashboard-top"><div><div class="small-lbl">Завершено тестов</div><div class="large-stat">${completed} <span class="subtle" style="font-size:19px">/ 34</span></div></div><div><div class="small-lbl">Слова, охваченные тестами</div><div class="large-stat">${seen.size} <span class="subtle" style="font-size:19px">/ 816</span></div></div><div class="dash-progress"><div class="small-lbl" style="margin-bottom:11px">Общий прогресс · ${pct(completed,34)}%</div><div class="progress-track"><div class="progress-fill" style="width:${pct(completed,34)}%"></div></div></div></div><div class="section-caption"><h2>Все 17 блоков</h2><span class="subtle" style="font-size:12px">2 теста × 24 слова</span></div><div class="block-grid">${DATA.blocks.map(b=>`<article class="panel block"><div class="block-head"><div><div class="block-num">БЛОК ${String(b.id).padStart(2,'0')}</div><div class="block-name">${esc(b.start)} – ${esc(b.end)}</div><div class="block-range">Слова ${((b.id-1)*48)+1}–${b.id*48} · 48 слов</div></div><span class="chip">48</span></div><div class="tests">${[1,2].map(h=>{const s=saved[key(b.id,h)];const n=(b.id-1)*48+(h-1)*24+1;return `<button class="test-btn ${s?.completed?'done':''}" data-start="${b.id}-${h}"><strong>Тест ${h} ${s?.completed?'✓':''}</strong><span>${n}–${n+23} · ${s?.completed?`${s.score}/24 с первого раза`:'Начать →'}</span></button>`}).join('')}</div></article>`).join('')}</div></section>`;
 document.querySelectorAll('[data-start]').forEach(btn=>btn.addEventListener('click',()=>{let [b,h]=btn.dataset.start.split('-').map(Number);start(b,h)}));
 window.scrollTo(0,0);
}
function start(b,h){const list=words(b,h);if(list.length!==QSIZE){alert('Ошибка набора слов, тест не загружен');return}
 current={b,h,items:list,mode:'main',sequence:list.map(x=>x.id),pos:0,selected:null,missed:[],firstCorrect:0,round:0,reviewQueue:[],reviewMiss:[],attempts:0};renderQuestion();window.scrollTo(0,0);
}
function question(){const id=current.sequence[current.pos];return DATA.words[id-1]}
function renderQuestion(){view='quiz';const s=current,x=question();const total=s.sequence.length;const review=s.mode==='review';
 $('root').innerHTML=`<section class="quiz-frame"><nav class="quiz-nav"><button class="back" id="home">← Все тесты</button><span class="chip">Блок ${s.b} · Тест ${s.h}</span></nav>${review?`<div class="review-banner"><strong>Работа над ошибками · Раунд ${s.round}</strong><br>Повтори слова, в которых ошибся. Неправильные ответы снова попадут в следующий раунд.</div>`:''}<div class="panel quiz-top"><div class="quiz-head"><div class="quiz-kicker">${review?'ПОВТОРЕНИЕ':'ОСНОВНОЙ ТЕСТ'}</div><div class="quiz-count">${s.pos+1} / ${total} ${review?`· ошибок в раунде: ${s.reviewMiss.length}`:''}</div></div><div class="progress-track"><div class="progress-fill" style="width:${pct(s.pos+(s.selected!==null?1:0),total)}%"></div></div></div><article class="panel question"><div class="word-tag">Choose the correct definition</div><div class="big-word">${esc(x.word)}</div><p class="prompt">Select one meaning in English.</p><div class="choices">${x.options.map((option,i)=>`<button class="choice" data-answer="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('')}</div><div id="feedback"></div><div id="actions" class="actions"></div></article></section>`;
 $('home').addEventListener('click',dashboard);
 document.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('click',()=>answer(Number(el.dataset.answer))));
}
function answer(i){const s=current;if(!s||s.selected!==null)return;const x=question();if(i<0||i>3)return;
 s.selected=i;s.attempts++;const ok=i===x.correct;
 if(s.mode==='main'){if(ok)s.firstCorrect++;else s.missed.push(x.id)}else if(!ok)s.reviewMiss.push(x.id);
 document.querySelectorAll('[data-answer]').forEach(el=>{const n=Number(el.dataset.answer);el.disabled=true;el.classList.add(n===x.correct?'is-right':n===i?'is-wrong':'muted')});
 $('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><div class="feedback-title">${ok?'✓ Верно!':'✕ Неверно'}</div><div class="feedback-desc"><strong>Correct meaning:</strong> ${esc(x.options[x.correct])}${!ok?`<br><strong>Full definition from PDF:</strong> ${esc(x.definition)}`:''}</div></div>`;
 const last=s.pos===s.sequence.length-1;
 $('actions').innerHTML=`<button class="primary" id="next">${last?(s.mode==='main'?(s.missed.length?'Повторить ошибки →':'Завершить тест →'):'Продолжить →'):'Следующее слово →'}</button>`;
 $('next').addEventListener('click',next);
}
function next(){const s=current;if(!s||s.selected===null)return;
 if(s.pos<s.sequence.length-1){s.pos++;s.selected=null;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});return}
 if(s.mode==='main'){
  if(s.missed.length===0){end();return}
  s.mode='review';s.round=1;s.reviewQueue=[...s.missed];s.sequence=[...s.missed];s.reviewMiss=[];s.pos=0;s.selected=null;renderQuestion();window.scrollTo(0,0);return;
 }
 if(s.reviewMiss.length>0){s.round++;s.reviewQueue=[...s.reviewMiss];s.sequence=[...s.reviewMiss];s.reviewMiss=[];s.pos=0;s.selected=null;renderQuestion();window.scrollTo(0,0);return}
 end();
}
function end(){const s=current;const k=key(s.b,s.h);const old=saved[k];const res={completed:true,score:s.firstCorrect,ids:s.items.map(x=>x.id),mistakes:s.missed.length,reviewRounds:s.round,when:new Date().toISOString()};if(!old||!old.completed||res.score>=old.score)saved[k]=res;store();view='summary';
 $('root').innerHTML=`<section class="panel summary"><div class="emoji">${s.missed.length?'🎯':'🏆'}</div><div class="small-lbl">БЛОК ${s.b} · ТЕСТ ${s.h} · ЗАВЕРШЁН</div><h1 style="margin-top:13px">Отлично, тест пройден!</h1><div class="score">${s.firstCorrect} <span style="font-size:32px;color:#9baad0">/ 24</span></div><p>Правильных ответов <strong>с первой попытки:</strong> ${s.firstCorrect} из 24 (${pct(s.firstCorrect,24)}%).<br>${s.missed.length?`Ошибок в первом проходе: <strong>${s.missed.length}</strong>. Все ошибочные слова повторены до правильного ответа за ${s.round} раунд${s.round===1?'':s.round<5?'а':'ов'}.`:'Ошибок нет — повторение не потребовалось!'}</p>${s.missed.length?`<h2 style="font-size:16px;margin-top:24px">Слова, потребовавшие повторения</h2><ul class="miss-list">${s.missed.map(id=>`<li><strong>${esc(DATA.words[id-1].word)}</strong><br><span class="subtle">${esc(DATA.words[id-1].clue)}</span></li>`).join('')}</ul>`:''}<div class="actions"><button class="secondary" id="again">Пройти тест ещё раз</button><button class="primary" id="all">Вернуться к блокам →</button></div><p class="legend">Результат учитывает только первые ответы. Повторение не меняет первоначальную оценку; оно помогает закрепить ошибки.</p></section>`;
 $('again').addEventListener('click',()=>start(s.b,s.h));$('all').addEventListener('click',dashboard);window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{if(view!=='quiz'||!current||e.altKey||e.ctrlKey||e.metaKey)return;if(['1','2','3','4'].includes(e.key)&&current.selected===null){e.preventDefault();answer(Number(e.key)-1)}else if(e.key==='Enter'&&current.selected!==null){e.preventDefault();next()}});
dashboard();
</script></body></html>
