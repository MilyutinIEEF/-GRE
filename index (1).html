nd free of imagination","unwilling to entertain playful ideas","playful, fanciful, or driven by odd whims"],"correct":3},{"id":813,"word":"whimsy","meaning":"a playful or fanciful idea or passing fancy","definition":"playful or fanciful idea","ru":"причуда; фантазия","options":["a logically necessary conclusion","a playful or fanciful idea or passing fancy","a realistic long-term plan","a serious commitment made after deliberation"],"correct":1},{"id":814,"word":"wistful","meaning":"sadly longing for something absent or past","definition":"vaguely longing; sadly thoughtful","ru":"тоскливо мечтательный; полный грустной тоски","options":["sadly longing for something absent or past","content with present circumstances","indifferent to memories of an earlier time","eager for immediate practical rewards"],"correct":0},{"id":815,"word":"zealot","meaning":"one who is fanatically devoted to a cause","definition":"one who is fanatically devoted to a cause","ru":"фанатик; ревностный приверженец","options":["a mildly interested observer","a detached critic of all political causes","an individual who avoids strong commitments","one who is fanatically devoted to a cause"],"correct":3},{"id":816,"word":"zealotry","meaning":"extreme, fanatical devotion to a cause or belief","definition":"fanaticism","ru":"фанатизм; чрезмерное рвение","options":["extreme, fanatical devotion to a cause or belief","moderate commitment to an idea","indifference to competing beliefs","a willingness to reconsider one's strongest convictions"],"correct":0}]}</script><script id="page-config" type="application/json">{"file":"index.html","type":"gre","title":"GRE Vocabulary · 816 слов","brand":"Barron’s GRE Vocabulary","sub":"816 words · Advanced practice","mark":"B","key":"gre-barrons-816-progress-v2","hero":"Запоминай слова.<br>Проверяй себя.","intro":"816 слов GRE в 17 блоках и 34 тестах. Изучи слова с переводом, затем выбери правильное английское определение. После каждого ответа появится перевод на русский. В конце теста все ошибки повторятся до верного ответа.","searchExample":"abject, belie, blase","accent":"#8898ff","tint":"#202b4d","glow":"#273666","source":"Barron’s 816 · 17 блоков × 48 слов"}</script><script>'use strict';
const DATA=JSON.parse(document.getElementById('lesson-data').textContent);
const CONFIG=JSON.parse(document.getElementById('page-config').textContent);
const $=id=>document.getElementById(id);

let saved={};try{const v=JSON.parse(localStorage.getItem(CONFIG.key)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))saved=v;}catch(e){}

$('search').addEventListener('input',e=>{queryText=e.target.value;resultLimit=80;$('clear-search').hidden=!queryText;catalogue();});$('clear-search').addEventListener('click',()=>{queryText='';$('search').value='';$('clear-search').hidden=true;resultLimit=80;catalogue();$('search').focus();});catalogue();scrollTop();}
function catalogue(){const q=fold(queryText);if(!q){$('search-status').textContent='';$('catalogue').innerHTML=`<div class="section-heading"><h2>${CONFIG.type==='gre'?'Все 17 блоков':'Все темы'}</h2><span class="muted" style="font-size:12px">Сначала изучи список, затем пройди тест</span></div><div class="topic-grid">${DATA.units.map(unitCard).join('')}</div>`;return;}
const terms=q.split(' '),matches=s=>terms.every(t=>fold(s).includes(t));const grouped=new Map();
for(const e of DATA.entries){if(!matches(word(e)+' '+e.ru))continue;const k=fold(word(e));if(!grouped.has(k))grouped.set(k,{entry:e,locations:[]});const target=grouped.get(k);for(const l of locations.get(e.id)||[])if(!target.locations.some(t=>t.unit===l.unit&&t.test===l.test))target.locations.push(l);}
const hits=[...grouped.values()].sort((a,b)=>{const x=fold(word(a.entry)),y=fold(word(b.entry));return (y===q)-(x===q)||(y.startsWith(q)?1:0)-(x.startsWith(q)?1:0)||a.entry.id-b.entry.id;});
const unitMatches=DATA.units.filter(u=>matches(u.name)||q===String(u.id)||q===fold(unitLabel(u.id)));

if($('more-results'))$('more-results').addEventListener('click',()=>{resultLimit+=80;catalogue();});}
function reference(e){return e.source?`<a class="reference-link" href="${esc(e.source)}" target="_blank" rel="noopener noreferrer">Значение в Cambridge Dictionary ↗</a>`:'';}
function example(e){return e.example?`<blockquote class="example"><span class="example-label">Пример употребления</span><span lang="en">${esc(e.example)}</span></blockquote>`:'';}
function study(unit){const u=units.get(unit);if(!u){home();return;}screen='study';session=null;const entries=u.tests.flat().map(id=>byId.get(id));$('root').innerHTML=`<section class="study"><div class="navrow"><a class="back" href="#">← К ${CONFIG.type==='gre'?'блокам':'темам'}</a><span class="eyebrow">${esc(unitLabel(unit))} · REFERENCE</span></div><div class="panel study-head"><h1 tabindex="-1" id="study-title" lang="en">${esc(u.name)}</h1><p>Все ${entries.length} ${isIdiom?'идиом темы':isCollocation?'сочетаний темы':'слов блока'} с переводом на русский. Сначала изучи список, затем пройди ${u.tests.length===1?'тест':'тесты'}.</p>${isIdiom?'<p style="font-size:12px">Вместо сокращений sb, smb, smn и sth в названиях раскрыты someone (кто-либо) и something (что-либо). Примеры показывают конкретное употребление.</p>':''}<div class="actions">${u.tests.map((_,t)=>`<a class="${t===0?'primary':'secondary'}" href="${testPath(unit,t)}">Начать тест ${t+1} →</a>`).join('')}</div></div><div class="study-grid">${entries.map((e,i)=>`<article class="study-card" data-entry="${e.id}"><span class="card-number">${i+1} / ${entries.length}</span><div class="study-word" lang="en">${esc(word(e))}</div><div class="study-ru" lang="ru">${esc(e.ru)}</div>${e.meaning?`<div class="study-meaning" lang="en">${esc(e.meaning)}</div>`:''}${example(e)}${reference(e)}</article>`).join('')}</div><div class="actions"><a class="secondary" href="#">← Ко всем ${CONFIG.type==='gre'?'блокам':'темам'}</a></div></section>`;scrollTop();$('study-title').focus({preventScroll:true});}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startTest(unit,test){const u=units.get(unit),ids=u?.tests[test];if(!ids?.length){home();return;}session={unit,test,original:[...ids],sequence:[...ids],pos:0,selected:null,missed:[],retryMissed:[],round:0,score:0,mode:'main'};renderQuestion();scrollTop();}
function item(){return byId.get(session.sequence[session.pos]);}
function renderQuestion(){screen='quiz';const s=session,e=item();s.display=shuffle(e.options.map((text,index)=>({text,index})));const rev=s.mode==='review';$('root').innerHTML=`<section class="quiz"><div class="navrow"><a class="back" href="#">← Все ${CONFIG.type==='gre'?'блоки':'темы'}</a><span class="eyebrow">${esc(unitLabel(s.unit))} · Тест ${s.test+1}</span></div>${rev?`<div class="review"><strong>Работа над ошибками · Раунд ${s.round}</strong><br>Повтори пропущенные карточки. Ошибка вернётся в следующем раунде.</div>`:''}<div class="panel quiz-top"><div class="quiz-top-row"><span class="eyebrow">${rev?'Повторение':'Основной тест'}</span><span class="quiz-count">${s.pos+1} / ${s.sequence.length}</span></div><div class="meter" role="progressbar" aria-label="Прогресс теста" aria-valuemin="0" aria-valuemax="${s.sequence.length}" aria-valuenow="${s.pos}"><div class="fill" id="quiz-fill" style="width:${percent(s.pos,s.sequence.length)}%"></div></div></div><article class="panel question"><div class="eyebrow" lang="en">${isCollocation?'Complete the collocation':'Choose the correct meaning'}</div><h1 class="word" id="question-word" tabindex="-1" lang="en">${isCollocation?esc(e.masked).replace('______','<span class="blank">______</span>'):esc(word(e))}</h1><p class="instruction">${isCollocation?'Выбери слово для сочетания из этой темы. Английский контекст, если он дан, уточняет нужное значение.':'Выбери одно английское определение. Перевод появится после ответа.'}</p>${isCollocation&&e.cue?`<div class="context"><span class="context-label">Context / intended meaning</span><span lang="en">${esc(e.cue)}</span></div>`:''}<div class="options" role="group" aria-label="Варианты ответа">${s.display.map((o,i)=>`<button class="option" type="button" data-answer="${i}"><span class="letter">${'ABCD'[i]}</span><span lang="en">${esc(o.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite" aria-atomic="true"></div><div class="actions" id="actions"></div><p class="search-help">Клавиши 1–4 — ответ · Enter — продолжить</p></article></section>`;document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.answer))));$('question-word').focus({preventScroll:true});}
function answer(i){const s=session;if(screen!=='quiz'||!s||s.selected!==null||!Number.isInteger(i)||i<0||i>=s.display.length)return;const e=item(),ok=s.display[i].index===e.correct;s.selected=i;
if(s.mode==='main'){if(ok)s.score++;else s.missed.push(e.id);}else if(!ok)s.retryMissed.push(e.id);
let correctLetter='';document.querySelectorAll('[data-answer]').forEach(b=>{const j=Number(b.dataset.answer),right=s.display[j].index===e.correct;b.disabled=true;b.classList.add(right?'correct':j===i?'incorrect':'dim');if(right)correctLetter='ABCD'[j];});
$('quiz-fill').style.width=percent(s.pos+1,s.sequence.length)+'%';$('quiz-fill').parentElement.setAttribute('aria-valuenow',s.pos+1);
$('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><div class="feedback-title">${ok?'✓ Верно!':'✕ Неверно'}</div><div class="answer-line">Правильный ответ: <strong>${correctLetter}. <span lang="en">${esc(e.options[e.correct])}</span></strong></div>${isCollocation?`<div class="answer-line">Полное сочетание: <strong lang="en">${esc(e.full)}</strong></div>`:''}<div class="translation"><span class="translation-label">Перевод на русский</span><span class="translation-value" lang="ru">${esc(e.ru)}</span></div>${example(e)}${reference(e)}</div>`;
const last=s.pos===s.sequence.length-1;let label=last?(s.mode==='main'&&s.missed.length?'Повторить ошибки →':s.mode==='review'&&s.retryMissed.length?'Следующий раунд →':'Завершить тест →'):'Следующая карточка →';$('actions').innerHTML=`<button class="primary" type="button" id="next">${label}</button>`;$('next').addEventListener('click',next);$('feedback').scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function next(){const s=session;if(screen!=='quiz'||!s||s.selected===null)return;if(s.pos<s.sequence.length-1){s.pos++;s.selected=null;renderQuestion();scrollTop();return;}
if(s.mode==='main'&&s.missed.length){s.mode='review';s.round=1;s.sequence=[...s.missed];s.retryMissed=[];s.pos=0;s.selected=null;renderQuestion();scrollTop();return;}
if(s.mode==='review'&&s.retryMissed.length){s.round++;s.sequence=[...s.retryMissed];s.retryMissed=[];s.pos=0;s.selected=null;renderQuestion();scrollTop();return;}finish();}
function finish(){const s=session,k=progressKey(s.unit,s.test),old=saved[k];const result={completed:true,score:s.score,count:s.original.length,ids:s.original,mistakes:s.missed.length,rounds:s.round,reviewRounds:s.round,when:new Date().toISOString()};if(!old?.completed||result.score>=Number(old.score||0)){saved[k]=result;save();}screen='summary';$('root').innerHTML=`<section class="panel summary"><div class="eyebrow">${esc(unitLabel(s.unit))} · Тест ${s.test+1} · Готово</div><h1 tabindex="-1" id="summary-title">Тест завершён!</h1><div class="score">${s.score} / ${s.original.length}</div><p>Правильных ответов с первой попытки: <strong>${percent(s.score,s.original.length)}%</strong>.<br>${s.missed.length?`Все ${s.missed.length} ошибочных карточек повторены до правильного ответа. Раундов повторения: ${s.round}.`:'Все ответы верны. Повторение не потребовалось.'}</p>${s.missed.length?`<h2>Закрепи эти ${isCollocation?'сочетания':isIdiom?'выражения':'слова'}</h2><ul class="missed">${s.missed.map(id=>{const e=byId.get(id);return `<li><strong lang="en">${esc(word(e))}</strong><span lang="ru">${esc(e.ru)}</span>${example(e)}</li>`;}).join('')}</ul>`:''}<div class="actions"><a class="secondary" href="${studyPath(s.unit)}">Изучить весь блок</a><button class="secondary" type="button" id="restart">Пройти ещё раз</button><a class="primary" href="#">К темам →</a></div><p style="font-size:12px">Оценка учитывает первые ответы. Повторение закрепляет ошибки и не меняет баллы основного теста. В общем прогрессе сохраняется лучший результат.</p></section>`;$('restart').addEventListener('click',()=>startTest(s.unit,s.test));scrollTop();$('summary-title').focus({preventScroll:true});}
function route(){const parts=location.hash.replace(/^#/,'').split('/');if(parts[0]==='study'&&/^\d+$/.test(parts[1]||'')&&units.has(Number(parts[1]))){study(Number(parts[1]));return;}if(parts[0]==='test'&&/^\d+$/.test(parts[1]||'')&&/^\d+$/.test(parts[2]||'')){const u=Number(parts[1]),t=Number(parts[2]);if(units.get(u)?.tests[t]){startTest(u,t);return;}}home();}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(screen!=='quiz'||!session||e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.closest?.('input,textarea,select,[contenteditable="true"]'))return;if(['1','2','3','4'].includes(e.key)&&session.selected===null){e.preventDefault();answer(Number(e.key)-1);}else if(e.key==='Enter'&&session.selected!==null){e.preventDefault();next();}});
route();
</script></body></html>
